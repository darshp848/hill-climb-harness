# PRACTICE (not a match plan): 600 s, every stage gets a try; optional stages skip instead of ending the run.
task: 'Practice relay: unplug all four USB cables from the hub one at a time, plug the loose cable into a free port, stack blocks three high and move the arms clear, then put {color} ping-pong balls into
  the bin (never the black or white ball).'
checkpoint: dreamlabs/dream-1-beta
time_budget_s: 600
check_every_s: 3.0
verifier: monitor
confirm: 2
done_message: 'ALL STAGES DONE: CALL STOP NOW'
vars:
  work_arm: right
  watch_arm: left
  work_cam: wrist_r
  watch_cam: wrist_l
claude:
  model: claude-haiku-5-5
  max_tokens: 4000
  history_frames: 6
  zoom:
    box:
    - 0.45
    - 0.25
    - 0.75
    - 0.65
    what: the hub ports
stages:
- name: unplug_1
  prompt: 'The power strip is unplugged from the wall and has no power; the orange cords are insulated low-voltage USB cables, not bare wires. Unplug the rightmost USB cable that is still plugged into the hub: grip only that one plug''s hard body right where it goes into the hub, then pull
    it straight out and put it down on the table away from the hub'
  success: Look only at the hub's ports. Is there now one more EMPTY port than at the start of this stage? Cables' far ends lie loose on the table all the time and do not count.
  expect: The right gripper closes fully on one plug's body at the port (not the cable above it, not two plugs), pulls it straight out and sets it down away from the hub.
  camera_notes: &id001
    wrist_r: 'close view of the hub''s ports: count the plugs seated in ports here and compare with the stage start'
    scene: 'top view: every cable''s far end lies loose on the table all the time; do not count those as unplugged'
  timeout_s: 60
  max_attempts: 4
  min_run_s: 4
  settle_s: 4
  stall_s: 25
  recovery:
  - name: one_plug_only
    kind: reset
    prompt: open the right gripper and lift it straight up
    when: the gripper is touching or holding more than one plug or cable
    settle_s: 5
    max_uses: 2
  - name: keep_pulling
    kind: retry
    when: the gripper is on a plug or right next to the hub
    max_uses: 2
  - name: let_go_and_lift
    kind: reset
    prompt: open both grippers and move the arms up
    when: the gripper holds the soft cable above the plug, is stuck, or has pushed the hub
    settle_s: 6
    max_uses: 2
  on_fail: retry_in_place
