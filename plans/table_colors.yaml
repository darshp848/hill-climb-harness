# Colour classes for harness/detect.py. HSV on PIL's 0-255 scale (hue 0-255, not 0-360).
# Tuned on Darsh's top-down phone photo of station C (Drive IMG_2698, 7 Nov 20:30): light wood table (S ~13,
# V ~230), blue and pink cubes with a hole, yellow and pink sticks, green / yellow / orange / white golf balls,
# white bin. Re-check on a frame from the station's own overhead camera before a match:
#   python -m harness.detect plans/table_colors.yaml frame.jpg --out boxed.jpg
# Shapes come from the blob, not the colour: ball (round), cube (compact square; an upright stick seen from above
# looks the same), stick (long and thin = lying on its side). `kinds` keeps only the listed shapes of a colour.
# Legal balls are the coloured ones; the WHITE ball is illegal (Darsh, 8 Nov), as are black 8-balls if present.
# White: the ball is a little brighter and bluer than the wood table (photo: ball H 149 S 37 V 245, table H 31 S 13
# V 232), but the white bin has the same colour as the ball, so only round blobs count. No black 8-ball is in the
# photos: that class is a guess (dark and round; the black gripper fingers are long, so they are dropped).
# Retuned on the station's own cameras (plug-unplug-v1 takes 39-41, 7 Nov evening light): the phone photo is brighter
# than the 640x360 camera. White ball on the right wrist camera: H 147, S 47, V 169-227 (median 193), so V >= 225
# matched 0.1% of it; the table there is H 49 S 13 V 185 (out on hue and saturation). Overhead green ball: H 114
# (the old range stopped at 110). Check: tests/data/guard_real/ and tests/test_guard_real_frames.py.
# 8 Nov, against hand labels on the overhead camera (docs/CLASSIFIERS_8NOV.md): the pale yellow-green golf ball is
# H 56-65, S 57-79, V 172-198, between the old yellow (30-55) and green (72-125) ranges, so yellow now runs H 30-70 from
# S 50. Yellow has no cubes on this table, so a compact yellow blob is a ball (one standing on a cube is an upright
# stick). The white bin is never a ball in the overhead view (harness.detect.OVERHEAD_BALL_MAX_FRAC).
annotate: true
# Overhead view only: blobs outside this box are ignored (people, chairs, laptops behind the table). Station C's
# scene camera shows the table below ~32% of the image height (last-run_inputs, 7 Nov).
table_roi: [0.0, 0.32, 1.0, 1.0]
guard:   # the guard trips on any ball whose role is avoid
  wrist_roles: [wrist]
  # Where a held ball's centre sits in the wrist image (x0 y0 x1 y1), and how much of the view it fills at least.
  # Measured on the right wrist camera: the fingertips are at x ~0.33 and ~0.65, y ~0.72, and a golf ball between
  # them is ~85 px wide at 640 (~3% of the view), centred near (0.5, 0.8). A ball lying on the table past the
  # fingertips is ~45 px (<1.1%) and centred above y 0.5. The old box (0.25-0.75, from y 0.35) with 1% let those
  # through: 3 false trips in one take once white was visible at all.
  grip_roi: [0.33, 0.6, 0.67, 1.0]
  grip_min_frac: 0.015
classes:
  # not_inside: the pale face and rim of a blue cube fall in this range too (overhead: cube rim H 140 S 36 V 174 vs
  # ball H 142 S 29 V 190), so a white blob centred on a blue object is that object, not a ball.
  white:  {hsv: [[130, 22, 165], [170, 75, 255]], min_frac: 0.0001, max_frac: 0.25, kinds: {ball: avoid}, small_ball: true,
           not_inside: [blue]}
  black:  {hsv: [[0, 0, 0], [255, 255, 55]], min_frac: 0.002, max_frac: 0.25, kinds: {ball: avoid}}
  green:  {hsv: [[72, 60, 120], [125, 255, 255]], min_frac: 0.0001, kinds: {ball: target}, small_ball: true}
  orange: {hsv: [[3, 90, 150], [24, 255, 255]], min_frac: 0.0001, kinds: {ball: target}, small_ball: true}
  yellow: {hsv: [[30, 50, 150], [70, 255, 255]], min_frac: 0.0001, kinds: {ball: target, stick: info}, small_ball: true}
  blue:   {hsv: [[135, 110, 80], [165, 255, 255]], min_frac: 0.0003, kinds: {cube: info, stick: info}}
  pink:   {hsv: [[200, 60, 120], [240, 255, 255]], min_frac: 0.0003, kinds: {cube: info, stick: info}}
