# Bot match plan v1: what worked by hand on the real bot on 8 Nov (docs/BOT_PROMPTS_2026-11-08.md), BASE Dream-1 only.
# From hybrid_v4_write.yaml. Order cable -> stack -> balls; 295 s clock; the same guard and pass bars.
#
# Cables: Dream approaches and grips with one fixed prompt; the harness fixes the grip and pulls (stage.grip_assist,
#   ported from tools/try_prompt.py --regrip 2 --pull-up 0.06 0.04 --pull-s 3 --seat-dz 0.01 --repull 2 --then ...):
#   2/2 plugs held through the pull on 8 Nov. The station's own 20 N up-pull (PAH_PULL_FORCE_N=r:20) helps too.
#   One cable per stage. The writer is off for cables: the approach prompt is the one that worked with the assist.
# Stack: cube order does not matter. Short Dream-style prompts with NO arm named ("the right arm" sent the far arm
#   and failed; with no arm named Dream used the near arm and stacked). The stage-prompt writer is off (its extra
#   detail hurt), and so are mid-stage rewrites.
# Balls: one named legal ball per call, written by the stage-prompt writer from what it sees: the legal ball nearest an
#   arm, with that arm named (8 Nov: a ball far from the right arm, three times, and the arm pushed the basket; the
#   left arm reaching across the table failed too). SKIP when none is in easy reach. Both arms in one prompt failed.
# Lock: stop_on_pass stops Dream at the first look that would pass a stage, before the Sonnet confirm, so it can't
#   undo it (8 Nov: "stack ... as high as possible" built blue on blue, then took it apart). A confirm "no" resumes.
# No homing between stages: only the /reset before the first stage (reset_first) and Dream's own IK-error reset.
# Hedged Dream calls are station-side (station_addons/pah_hedge.py): start the station with PAH_HEDGE_N=2
#   PAH_HEDGE_CUTOFF_S=1.5 PAH_HEDGE_MAX_CALLS=3. claude.hedge 2 hedges the fast monitor's looks the same way.
#
# Monitor: the frequent looks on a fast OpenRouter model (--monitor-model, default google/gemini-3.1-flash-lite);
# confirm_model and writer_model (claude-sonnet-5-5) stay on the Anthropic API. On 8 Nov Flash-Lite missed a real
# unplug and rewrote prompts 11 times in a run, hence rewrite_max 1 and the Sonnet confirm_check on every unplug.
#
# Match (no human input: --no-operator; keys from Doppler, never on the command line):
#   doppler run -p nous -c dev -- ~/Documents/Work/hackathon/makermods-pah/harness/.venv/bin/python -m harness plans/bot_v1.yaml --live --no-operator \
#       --monitor-model google/gemini-3.1-flash-lite --detect plans/table_colors.yaml --live-guard
# --live refuses to start without --detect ... --live-guard: the illegal-ball guard on both wrists at 10 Hz, which
# sends /stop on its own (8 Nov by hand: Dream put the WHITE ball in when the green one it was told to take was gone).
# Practice stack + balls only: add --skip cable_ ; balls only: --skip cable_ --skip arms_ --skip stack --skip tower
task: >-
  Hill Climb relay. Stage 1: unplug a USB cable from the power strip and put it down away from the strip (then one
  more the same way). Never plug a cable in. Stage 2: stack the blocks into a free-standing tower more than 4 inches
  (10 cm) tall. Do not touch the blocks before a cable is unplugged. Stage 3: put the green, yellow and orange golf
  balls into the white bin, never the white ball or a black ball, without touching the tower. Do not touch the balls
  before the tower passes.
checkpoint: dreamlabs/dream-1-beta   # base Dream-1: the 8 Nov fine-tune was worse on every task
time_budget_s: 295
check_every_s: 1.0     # a fast-monitor look about every second (Flash-Lite answers in ~2.6 s: 3 in flight)
verifier: monitor
confirm: 2
done_message: "ALL STAGES DONE: CALL STOP NOW"
vars:
  safe: "The power strip is unplugged from the wall and has no power; the orange cords are insulated low-voltage USB cables, not bare wires."
  ball: green, yellow or orange golf ball
# model: the monitor's model on the api backend; with --monitor-model / --claude-backend openrouter the frequent looks
# go to the OpenRouter model instead. confirm_model and writer_model are in $HARNESS_ANTHROPIC_MODELS: Anthropic API.
claude: {model: claude-haiku-5-5, max_tokens: 4000, history_frames: 4, stitch: true, parallel: 3, hedge: 2, writer_model: claude-sonnet-5-5, confirm_model: claude-sonnet-5-5}
reset_first: true
stop_on_pass: true
rewrite_prompts: true
write_prompts: true     # balls only: cable and stack stages set write_prompt false
rewrite_max: 1
rewrite_cooldown_s: 30
prompt_prefix: "{safe}"

guard:
  question: "Is either gripper holding the white ball or a black ball (balls that must never go in the bin), or closed or closing around one?"
  stages: [ball_]
  confirm: 1
  message: "ILLEGAL BALL HELD: RUN STOPPED. CALL STOP NOW"
  max_blind_s: 20

# Shapes only, bottom to top: colour order does not matter (Darsh, 8 Nov). For the monitor's tower report; no
# tower_prompts: the stack prompts below are the short ones that worked.
tower_target:
  - "cube"
  - "cube"
  - "cube"
  - "square stick, standing upright"
  - "round stick, standing upright"

system_prompt: |-
  You supervise a robot (two MakerMods Metal arms, run by the Dream-1 model) doing a timed relay on one table, and you judge each stage from its cameras. Rules and lessons from testing on this station:

  STATION
  - Cameras: one overhead (scene), one on each wrist (wrist_l, wrist_r). The right arm does the cables; for stacking and balls the arm nearest the object does the work.
  - The gripper sensors are measured and beat the images for what a gripper holds: "stopped at 0.30" = holding something; "closed fully on nothing" = holding NOTHING, whatever the image seems to show. Never report a held cable or block on a gripper the sensor says is empty.
  - Between robot motions the harness itself may stop the robot and move the right hand straight up or down (fixing a grip, pulling a plug). The arm standing still holding a plug, or the robot idle after putting a cable down, is expected, not a stall.

  CABLES
  - The "hub" is a black power strip, unplugged from the wall. The USB ports are on its top face; plugs stand vertical and come out by pulling straight up, one at a time, with the right arm.
  - Count plugs in their ports. A cable's far end lies loose on the table from the start: that never counts as unplugged. An unplugged cable may not be plugged back in.
  - Once a plug is out it often lies loose next to the strip or on the table to the right. That one is DONE.

  STACKING
  - Touching a block before at least one cable is unplugged is a disqualification.
  - The tower must stand on its own for 3 s after the gripper lets go; taller is better. Cubes at the bottom, sticks on top; the colours can be in any order.

  BALLS
  - Only the green, yellow and orange golf balls go in the white bin. Never let the white ball or a black ball go in. Do not touch the tower.

  WRITING ROBOT INSTRUCTIONS
  - One short action in plain words, naming ONE object by colour and position, e.g. "With the right arm, pick up the orange golf ball on the right side of the table and drop it into the white basket." One ball per instruction, with the arm on that ball's side of the table. No negations ("not the white ball"): name the right ball instead.
  - Only write next_prompt when the robot is on the wrong object or step, plainly stuck, or about to fail.

stages:
  # ---- Stage 1 (pass bar: one cable out) ----
  - &unplug
    name: cable_unplug
    prompt: "{safe} With the right gripper half open, move down onto a plug standing upright in a port on top of the black power strip, then close the gripper on that plug and pull it straight up."
    write_prompt: false
    grip_assist:
      regrip: 2            # Dream shut on air: open 0.6 in place, lower 1.5 cm, close
      regrip_dz: -0.015
      pull_up_m: [0.06, 0.04]
      pull_s: 3            # seconds per lift step: slower slips less
      seat_dz: 0.01        # open a little and lower 1 cm before the squeeze, so the jaws bite the plug body
      repull: 2            # slipped on the way up: straight back down, re-grip, pull again
      hold: [0.045, 0.20]  # a held plug reads 0.05-0.15; <= 0.045 is shut on nothing; a pull from 0.27 lost it
      put_down_prompt: "Put the held cable down on the table to the right, away from the power strip, and open the gripper."
      put_down_s: 15
      min_z: 0.05          # a plug in the strip is gripped at ~0.08 m; a cable on the table at ~0.02 m: never pull that
      pass_on_pull: true   # a pull that held + Sonnet's seated-plug count = pass now (Flash-Lite missed a real one)
    success: "Compared with the stage-start images, is at least one plug that was seated in a port of the power strip at the start now fully out of its port (held up in the right gripper, or lying loose next to the strip or on the table)? Count the seated plugs; loose far ends of cables do not count."
    expect: "The right gripper closes on one plug's hard body at the port and the plug comes straight up out of it; then the cable is put down on the table to the right."
    camera_notes:
      wrist_r: "close view of the power strip's ports: count the plugs seated in ports and compare with the stage start"
      scene: "top view: every cable's far end lies loose on the table all the time; do not count those as unplugged"
    timeout_s: 60          # Dream's time only: the harness's own grip and pull do not count against it
    max_attempts: 99       # pass bar: keep trying until the clock runs out
    min_run_s: 4
    settle_s: 4
    stall_s: 30
    recovery:
      - {name: keep_going, kind: retry, when: "the gripper is on a plug or right next to the strip", max_uses: 4}
      - {name: let_go_and_lift, kind: reset, prompt: "open both grippers and move the arms up",
         when: "the gripper is stuck, holds the cord instead of the plug, or has pushed the strip", settle_s: 5, max_uses: 3}
    confirm: 1
    confirm_check: "Count the USB plugs standing seated in the power strip's ports in the STAGE START images, then in the NOW images. Is the NOW count lower, so a plug that was seated has been pulled fully out of its port? Every cable's far end lies loose on the table from the start and is NOT an unplugged plug. Answer yes only if you can see an empty port that was filled, or the plug held or lying clear of the strip."
    on_fail: retry_in_place

  # Only when Dream unplugged without the assist and still holds the cable: the assist puts it down itself.
  - &put_down
    name: cable_put_down
    requires_stage: cable_unplug
    prompt: "{safe} Put the held cable down on the table to the right, away from the power strip, and open the gripper."
    write_prompt: false
    skip_if_done: true
    success: "Is the right gripper open and empty, holding no cable? (The left arm is not used; ignore its gripper.)"
    timeout_s: 20
    min_run_s: 3
    confirm: 1
    on_fail: skip

  - <<: *unplug
    name: cable_unplug_more
    success: "Compared with the stage-start images, is one more plug now fully out of its port than at the start of this stage?"
    max_attempts: 3
    on_fail: skip          # the second cable is +5, not the pass bar

  - <<: *put_down
    name: cable_put_more_down
    requires_stage: cable_unplug_more

  - name: arms_clear
    prompt: "open both grippers and move the arms up"
    write_prompt: false
    success: "Are both grippers open and raised, clear of the power strip, the cables and the blocks?"
    timeout_s: 10
    min_run_s: 2
    confirm: 1
    on_fail: skip

  # ---- Stage 2 (pass bar: tower > 4 in, free-standing 3 s after release). No arm named, no writer. ----
  - name: stack_base
    prompt: "move a blue cube to the middle of the table, close in front of the robot"
    write_prompt: false
    success: "Is a blue cube standing on the table in the middle, close in front of the robot, with no gripper holding it?"
    camera_notes:
      scene: "top view of the table: where the cubes are"
    timeout_s: 40
    max_attempts: 2
    min_run_s: 4
    stall_s: 30
    confirm: 1
    skip_if_done: true
    on_fail: skip          # a base anywhere still stacks

  - &stack
    name: stack_2
    prompt: "put a cube on top of the other cube"
    retry_prompt: "stack the blocks and sticks as high as possible"   # stacked 2 cubes in 64 s on 7 Nov
    write_prompt: false
    success: "Is one cube resting on top of another cube, standing on its own, with no gripper touching either?"
    expect: "An arm picks up a cube, lowers it onto the other cube, opens and lifts clear; the two stay stacked."
    camera_notes:
      scene: "top view of the table: the cubes and any stack"
    timeout_s: 50
    max_attempts: 99
    min_run_s: 4
    stall_s: 35
    confirm: 1             # one look stops Dream (stop_on_pass); Sonnet's confirm_check decides
    confirm_check: "In the NOW images, is at least one cube resting on top of another cube, standing on its own, with no gripper holding or touching either cube?"
    recovery:
      - {name: keep_going, kind: retry, when: "a cube is held, or the stack is standing and the arm is near it", max_uses: 3}
      - {name: let_go_and_lift, kind: reset, prompt: "open both grippers and move the arms up",
         when: "the gripper is stuck on a cube or pressing on the stack", settle_s: 5, max_uses: 2}
    on_fail: retry_in_place

  - <<: *stack
    name: tower_pass
    prompt: "stack the blocks and sticks as high as possible"
    success: "Is the tower more than 4 inches (10 cm) tall, standing on its own, with both grippers open and clear of it?"
    expect: "The arm adds pieces to the stack until it is over 4 inches tall, then lifts clear; the tower stays standing."
    confirm_check: "In the NOW images, is there a tower of stacked pieces more than 4 inches (10 cm) tall (a cube is about 2 inches), standing on its own, with no gripper holding or touching it?"
    skip_if_done: true

  # ---- Stage 3: no pass bar. The guard stops the run if an illegal ball is held. One named ball per call. ----
  - &ball
    name: ball_1
    prompt: "With the arm nearest to it, pick up one {ball} and drop it into the white basket."
    writer_notes: "Pick the ONE legal ball (green, yellow or orange golf ball; never the white ball or a black ball) that is closest to one of the arms and reachable without passing over the tower, the blocks or the white basket. Name the arm on that ball's side of the table: \"With the right arm, ...\" for a ball on the right arm's half, \"With the left arm, ...\" for a ball on the left arm's half. Say where the ball is (e.g. \"the orange golf ball at the front right of the table\"). If no legal ball outside the basket is in easy reach of either arm, the answer is SKIP."
    success: "Compared with the stage-start images, is there one more {ball} resting inside the bin than at the start of this stage, with no white or black ball in the bin and the tower (if any) still standing?"
    expect: "The right arm picks up one named {ball}, staying clear of the white ball, any black ball and the tower, and releases it over the bin."
    timeout_s: 40
    min_run_s: 3
    stall_s: 30
    confirm: 1
    confirm_check: "Count the green, yellow and orange golf balls inside the white bin in the STAGE START images, then in the NOW images. Is the NOW count higher, with no white or black ball in the bin?"
    on_fail: skip
  - <<: *ball
    name: ball_2
  - <<: *ball
    name: ball_3
  - <<: *ball
    name: ball_4
  - <<: *ball
    name: ball_5
  - <<: *ball
    name: ball_6
