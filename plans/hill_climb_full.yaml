# Hill Climb relay, FULL plan: the sprint stages, then Stage 3 balls until the clock runs out.
# Run with: --var color=<your color>  (assigned by coin flip at the match, e.g. orange or white).
# Each ball: own color +5, other color -5, black 8-ball in the bin = match lost.
# Base: the SPRINT plan (from hillclimb_rubric_v2.pdf, 7-8 Nov 2026).
# Pass Stage 1 (unplug one cable, +10) and Stage 2 (a free-standing 3-layer / 6 inch stack, +20), then end the
# run so the designated team member calls "stop" for the time bonus (+1 per 2 s left, only if Stages 1 and 2
# passed). At that rate a ball (+5) is only worth chasing if it takes under 10 s, an extra block (+10) under
# 20 s, so stopping early usually wins. Use hill_climb_full.yaml if the balls turn out to be fast.
#
# Rules that shape this plan:
# - Touching a later stage's object before the current pass bar is met is a DQ. So a false "done" is a DQ:
#   confirm: 2, the monitor's questions, and never on_fail: skip on Stages 1-2 (keep retrying until time).
# - No human input after "go": the verifier is `monitor` only. Do NOT use manual or monitor+manual in a match
#   (a y/n key press is human input). Do NOT use `time` either: it would move on without the pass bar (DQ risk).
# - The stack must stand 3 s after the gripper lets go: the last stage needs 2 "done" verdicts 3 s apart.
# - An unplugged cable may not be plugged back in, so the cable is put down away from the hub.
task: >-
  Hill Climb relay: first unplug one USB cable from the hub and put it down, then stack blocks into a
  free-standing tower at least 3 layers (6 inches) tall and move the arms away from it.
  Do not touch the blocks before a cable is unplugged. Then put {color} ping-pong balls into the bin, one at a time, never the black ball and never another color, without touching the stack.
checkpoint: dreamlabs/dream-1-beta   # base Dream-1; a Metal/Maker station has no default model. Set your dream-1-ft:... fine-tune here
time_budget_s: 295          # 5-minute match; a little margin for the start
check_every_s: 3.0
verifier: monitor
confirm: 2
done_message: "ALL STAGES DONE: CALL STOP NOW"
# Which arm plugs the loose cable in and which one only watches with its wrist camera (a second viewpoint,
# because the overhead camera is poor at depth). Override at the match: --var work_arm=left --var watch_arm=right
# --var work_cam=wrist_l --var watch_cam=wrist_r
vars: {work_arm: right, watch_arm: left, work_cam: wrist_r, watch_cam: wrist_l}
claude: {model: claude-haiku-5-5, max_tokens: 4000, history_frames: 6, zoom: {box: [0.45, 0.25, 0.75, 0.65], what: "the hub ports"}}   # 600 cut off every reply: Haiku 5.5 thinks before answering

stages:
  - name: watcher_for_unplug
    prompt: "move the left arm beside the hub so its wrist camera looks at the hub ports from the side, without touching anything"
    success: "Does the wrist_l camera show the hub's ports from the side, with the left gripper touching nothing?"
    expect: "The left arm rises and parks a short distance from the hub on the hub side, away from the blocks, its wrist camera pointed at the ports."
    camera_notes:
      "wrist_l": "wrist camera of the left arm, which should end up looking at the hub ports from the side"
    timeout_s: 15
    max_attempts: 1
    min_run_s: 3
    on_fail: skip             # no watcher is fine; the unplug still has the top, zoom and right-wrist views

  - name: unplug_cable
    # The end cable nearest the working arm: a clear approach (no neighbouring plug in the fingers' way), an unblocked
    # view for the overhead and wrist cameras, and the shortest reach. Middle cables got wire grabs and half grips.
    prompt: "unplug the USB cable at the end of the hub nearest the right arm: grip only that one plug's hard body right where it goes into the hub, not the cable above it and not the plugs beside it, then pull it straight out along the port"
    success: "Look only at the hub's ports. Is there now an EMPTY port that had a plug in it at the stage start? Each cable's other end always lies loose on the table from the start, and that does not count."
    history_cameras: ["wrist_l"]
    camera_notes:
      "wrist_l": "side view of the hub ports from the watcher arm, if it got there: count the seated plugs"
      "wrist_r": "close view of the hub's ports: count the plugs seated in ports here and compare with the stage start"
      "scene": "top view: every cable's far end lies loose on the table all the time; do not count those as unplugged"
    expect: "A gripper closes on the plug of a cable in the hub and pulls it straight out until the plug is clear."
    timeout_s: 60
    max_attempts: 8
    min_run_s: 4
    settle_s: 4
    stall_s: 20
    recovery:
      - {name: one_plug_only, kind: reset, prompt: "open the right gripper and lift it straight up",
         when: "the gripper is touching or holding more than one plug or cable", settle_s: 5, max_uses: 3}
      - {name: keep_pulling, kind: retry, when: "the gripper is on a plug or right next to the hub", max_uses: 3}
      - {name: let_go_and_lift, kind: reset, prompt: "open both grippers and move the arms up",
         when: "the gripper is stuck, holds the wire instead of the plug, or has pushed the hub", settle_s: 6, max_uses: 3}
    on_fail: retry_in_place   # never skip: the blocks are off limits until a cable is out

  - name: put_cable_down
    prompt: "put the USB cable down on the table away from the hub and open the gripper"
    success: "Are both grippers empty, with the unplugged cable lying on the table outside the hub?"
    expect: "The arm moves the loose cable away from the hub, lowers it to the table and opens."
    timeout_s: 25
    max_attempts: 4
    min_run_s: 3
    recovery:
      - {name: release, kind: reset, prompt: "open both grippers and move the arms up",
         when: "the cable is still held or tangled on the gripper", settle_s: 5, max_uses: 3}
    on_fail: retry_in_place

  # Optional +20 per cable: plug a LOOSE cable (one that started on the table) into a free hub port.
  # Stage 1's pass bar is already met, so these are allowed; on_fail skip keeps them from eating the clock.
  # Extra unplugs: +5 each (all 4 cables start in the hub). The time bonus pays +1 per 2 s, so one is only worth it
  # if it takes under ~10 s: short timeout, one attempt, skip on failure. Off the critical path to the stack.
  - &more_unplug
    name: unplug_more_2
    prompt: "unplug the next USB cable along the hub, nearest the right arm"
    success: "Look only at the hub's ports. Is there now one more EMPTY port than at the start of this stage? Cables' far ends lie loose on the table all the time and do not count."
    expect: "A gripper closes on another plug in the hub and pulls it straight out."
    timeout_s: 15
    max_attempts: 1
    min_run_s: 3
    on_fail: skip
  - <<: *more_unplug
    name: unplug_more_3
  - <<: *more_unplug
    name: unplug_more_4

  - name: watcher_into_place
    prompt: "park the {watch_arm} arm beside the hub, with its wrist camera looking across the table at the hub ports; keep both grippers clear"
    success: "Do the newest {watch_cam} and overhead views confirm the watcher is beside the hub, its gripper is clear, and its wrist camera sees a free port side-on? A top-down view does not count."
    expect: "The {watch_arm} arm rises and parks a short distance from the hub, its wrist camera pointed at the ports from the side."
    cameras: [overhead, "{watch_cam}"]
    required_cameras: [overhead, "{watch_cam}"]
    history_cameras: ["{watch_cam}"]
    camera_notes:
      "{watch_cam}": "wrist camera of the {watch_arm} arm, which should end up looking at the hub ports from the side"
    timeout_s: 15
    max_attempts: 1
    min_run_s: 3
    on_fail: skip             # skip the optional plug-in if the watcher cannot be verified

  - name: plug_loose_cable
    requires_stage: watcher_into_place
    prompt: "with the {work_arm} arm, plug the loose USB cable on the table into a free port on the hub while the {watch_arm} arm stays still"
    success: "Use the newest {watch_cam} side view and overhead view together. Is the plug of a formerly loose cable fully seated in a free port, with the watcher still aimed at the port? If the side view lost the port or cannot show the plug depth, withhold success."
    expect: "The {work_arm} gripper picks the loose cable up by its plug, lines the plug up with a free port and pushes it in until it is seated, while the {watch_arm} arm holds still."
    cameras: [overhead, "{watch_cam}", "{work_cam}"]
    required_cameras: [overhead, "{watch_cam}"]
    history_cameras: ["{watch_cam}"]
    camera_notes:
      "scene": "top view: shows which port and the left-right alignment; poor at depth and insertion"
      "{watch_cam}": "side view from the {watch_arm} arm, which is only watching: use it for the plug's distance to the port, its height and whether it is pushed fully in"
      "{work_cam}": "close view from the gripper doing the plugging"
    timeout_s: 40
    max_attempts: 2
    min_run_s: 4
    stall_s: 15
    recovery:
      - {name: realign, kind: retry, when: "the plug is held and near the port but not lined up", max_uses: 1}
      - {name: back_off, kind: reset, prompt: "move the {work_arm} arm up and away from the hub while holding the cable",
         when: "the plug is jammed against the hub or pushing the hub", settle_s: 4, max_uses: 1}
    on_fail: skip             # +20 is worth it only if it is fast (it costs 1 point of clock per 2 s)

  - name: release_before_stack
    prompt: "open both grippers and move both arms up, away from the hub"
    success: "Are both grippers empty and clear of the hub and cables?"
    timeout_s: 15
    max_attempts: 2
    min_run_s: 3
    on_fail: retry_in_place

  - name: stack_two
    prompt: "put a block on top of another block"
    success: "Is one block resting on top of another block, with no gripper holding it?"
    expect: "An arm picks up a block and sets it squarely on another block, then opens."
    timeout_s: 50
    max_attempts: 6
    min_run_s: 4
    stall_s: 20
    recovery:
      - {name: keep_going, kind: retry, when: "a block is held or the top block sits on the base", max_uses: 3}
      - {name: reopen, kind: reset, prompt: "open both grippers and move the arms up",
         when: "a block was dropped, knocked over, or the gripper is stuck", settle_s: 6, max_uses: 3}
    on_fail: retry_in_place

  - name: stack_three
    prompt: "put another block on top of the stack"
    success: "Is the stack three blocks tall, standing on its own with no gripper touching it?"
    expect: "An arm picks up a third block and places it on the two-block stack without knocking it, then opens."
    timeout_s: 50
    max_attempts: 6
    min_run_s: 4
    stall_s: 20
    recovery:
      - {name: keep_going, kind: retry, when: "the stack is still standing and a block is held or near the top", max_uses: 3}
      - {name: rebuild, kind: reset, prompt: "put a block on top of another block",
         when: "the stack fell over", settle_s: 15, max_uses: 2}
    on_fail: retry_in_place

  - name: clear_of_stack
    prompt: "move the arms up and away from the stack without touching it"
    success: "Is the stack at least three blocks tall and standing on its own, with both arms clear of it?"
    expect: "Both arms rise and move back; the stack stays standing."
    timeout_s: 20
    max_attempts: 3
    min_run_s: 3
    recovery:
      - {name: rebuild, kind: reset, prompt: "put another block on top of the stack",
         when: "the stack lost a block or fell", settle_s: 15, max_uses: 2}
    on_fail: retry_in_place

  - &ball
    name: ball_1
    prompt: "put a {color} ping-pong ball in the bin without touching the stack"
    success: "Is at least 1 {color} ball resting inside the bin, with no black ball in the bin?"
    expect: "An arm picks up one {color} ball, avoiding the black ball and the stack, and drops it into the bin."
    timeout_s: 30
    max_attempts: 3
    min_run_s: 3
    stall_s: 15
    recovery:
      - {name: drop_black, kind: reset, prompt: "put the black ball down on the table far from the bin",
         when: "a gripper is holding the black ball", settle_s: 5, max_uses: 3}
      - {name: remove_black, kind: reset, prompt: "take the black ball out of the bin and put it on the table",
         when: "the black ball is inside the bin", settle_s: 10, max_uses: 3}
      - {name: drop_wrong, kind: reset, prompt: "put the ball down on the table away from the bin",
         when: "a gripper is holding a ball that is not {color}", settle_s: 5, max_uses: 3}
      - {name: keep_going, kind: retry, when: "a {color} ball is held or close to the gripper", max_uses: 2}
    on_fail: skip             # no pass bar on Stage 3; a missed ball just moves on
  - <<: *ball
    name: ball_2
    success: "Are at least 2 {color} balls resting inside the bin, with no black ball in the bin?"
  - <<: *ball
    name: ball_3
    success: "Are at least 3 {color} balls resting inside the bin, with no black ball in the bin?"
  - <<: *ball
    name: ball_4
    success: "Are at least 4 {color} balls resting inside the bin, with no black ball in the bin?"
  - <<: *ball
    name: ball_5
    success: "Are at least 5 {color} balls resting inside the bin, with no black ball in the bin?"
  - <<: *ball
    name: ball_6
    success: "Are at least 6 {color} balls resting inside the bin, with no black ball in the bin?"
  - <<: *ball
    name: ball_7
    success: "Are at least 7 {color} balls resting inside the bin, with no black ball in the bin?"
  - <<: *ball
    name: ball_8
    success: "Are at least 8 {color} balls resting inside the bin, with no black ball in the bin?"
